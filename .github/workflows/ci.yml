name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      # The shipped binary is CGO-free; fail if a CGO dependency sneaks in.
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: go test -race ./...
